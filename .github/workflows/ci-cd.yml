name: CI/CD Pipeline - AutoCUB

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 1. Pipeline de Testes e Qualidade (TDD & Lint)
  # ==========================================================
  test-and-quality:
    name: Tests & Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov flake8

      - name: Verificação de Sintaxe e Estilo (Lint)
        run: |
          # Checa erros de sintaxe críticos e variáveis indefinidas
          flake8 autocub tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Alertas leves sem quebrar o pipeline
          flake8 autocub tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Executar Testes Unitários (TDD)
        run: pytest -m unit

      - name: Executar Testes de Integração
        run: pytest -m integration

      - name: Executar Testes End-to-End (E2E)
        run: pytest -m e2e

      - name: Relatório Geral de Cobertura de Testes
        run: |
          pytest --cov=autocub --cov-report=xml --cov-report=term-missing

      - name: Upload de Relatório de Cobertura
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ==========================================================
  # 2. Build da Imagem Docker (CI)
  # ==========================================================
  docker-build:
    name: Build & Push Docker Image (GHCR)
    needs: [ test-and-quality ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair Metadados do Docker (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # 3. Release Automatizado no GitHub (CD)
  # ==========================================================
  release:
    name: Publicar GitHub Release
    needs: [ docker-build ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar GitHub Release Automatizada
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
