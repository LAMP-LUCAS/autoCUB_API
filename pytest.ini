[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*

python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Testes unitários rápidos e isolados (parser, schemas, models)
    integration: Testes de integração (endpoints FastAPI e persistência no banco)
    e2e: Testes de ponta a ponta (coleta -> parse -> upsert -> consulta na API)
filterwarnings =
    ignore::DeprecationWarning:fastapi.*:
